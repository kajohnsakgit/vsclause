<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Desk</title>
  <style>
    :root {
      --bg: #12110f;
      --bg-2: #1b1916;
      --card: #1a221c;
      --ink: #f3efe4;
      --muted: #b7b0a0;
      --line: #2d3a32;
      --gold: #d7b56d;
      --gold-2: #f0d9a0;
      --green: #8fbf8a;
      --danger: #d9786a;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Sarabun", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #24352c, transparent 55%),
        var(--bg);
    }

    .wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      margin: 0 0 8px;
    }

    h1 { margin: 0; font-size: 42px; line-height: 1; font-weight: 700; }
    .sub { color: var(--muted); margin: 10px 0 0; max-width: 620px; }

    .top-actions, .form-actions, .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button, .btn {
      border: 1px solid var(--line);
      background: #223028;
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.primary, .btn.primary { background: var(--gold); color: #1b1408; border-color: var(--gold); font-weight: 700; }
    button.ghost { background: transparent; }
    button.danger { color: #ffd4cc; border-color: #6d3b34; }

    .panel, .card {
      background: linear-gradient(180deg, #202a23, var(--card));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .panel { padding: 22px; margin-bottom: 22px; }
    form { display: grid; gap: 14px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
    label { display: grid; gap: 7px; font-size: 14px; color: var(--muted); }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #121916;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
    }
    textarea { min-height: 92px; resize: vertical; }

    .hint { font-size: 13px; color: var(--muted); margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { padding: 18px; display: grid; gap: 10px; }
    .card h2 { margin: 0; font-size: 22px; }
    .command {
      font-family: Consolas, "Courier New", monospace;
      color: var(--gold-2);
      background: #101714;
      padding: 7px 10px;
      border-radius: 999px;
      width: fit-content;
      font-size: 14px;
    }
    .cap { margin: 0; color: var(--muted); min-height: 60px; }
    .link a { color: var(--green); }
    .empty { color: var(--muted); padding: 28px; text-align: center; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: var(--gold);
      color: #1b1408;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
    }

    @media (max-width: 720px) {
      .fields, header { grid-template-columns: 1fr; display: grid; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">Cursor Skill Desk</p>
        <h1>คลัง Skill ของฉัน</h1>
        <p class="sub">เก็บชื่อ skill, ความสามารถ และลิงก์เข้าใช้ เพิ่มเองได้ และอัปเดตลิงก์เมื่อไหร่ก็ได้</p>
      </div>
      <div class="top-actions">
        <button class="ghost" id="exportBtn" type="button">Export JSON</button>
        <button class="ghost" id="importBtn" type="button">Import JSON</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </header>

    <section class="panel">
      <form id="skillForm">
        <input type="hidden" id="skillId">
        <div class="fields">
          <label>ชื่อ skill
            <input id="skillName" required placeholder="เช่น Email Professional">
          </label>
          <label>คำสั่งใน Cursor
            <input id="skillCommand" placeholder="เช่น /email-english">
          </label>
          <label class="full">ความสามารถของ skill นี้
            <textarea id="skillCapability" required placeholder="เช่น เขียนอีเมลภาษาอังกฤษอย่างเป็นทางการ"></textarea>
          </label>
          <label class="full">ลิงก์เข้าใช้งาน
            <input id="skillLink" type="url" placeholder="https://... หรือลิงก์ไฟล์ skill">
          </label>
        </div>
        <p class="hint" id="slugHint">ถ้าไม่ใส่คำสั่ง ระบบจะสร้างให้อัตโนมัติ เช่น Email Professional → /email-professional</p>
        <div class="form-actions">
          <button class="primary" type="submit" id="saveBtn">เพิ่ม skill</button>
          <button class="ghost" id="cancelEdit" type="button" hidden>ยกเลิกแก้ไข</button>
        </div>
      </form>
    </section>

    <div id="list" class="grid"></div>
  </div>
  <div class="toast" id="toast">คัดลอกแล้ว</div>

  <script>
    const STORAGE_KEY = "vsclause-skill-desk-v1";

    const SEED = [
      {
        id: "email-english",
        name: "Email Professional",
        command: "/email-english",
        capability: "เขียนและแก้เมลภาษาอังกฤษอย่างเป็นทางการ ใช้เมื่อต้องส่งเมลธุรกิจ ตอบลูกค้า หรือแปลงข้อความไทยเป็นอีเมลทางการ",
        link: "./.cursor/skills/email-english/SKILL.md",
        seeded: true
      },
      {
        id: "big-work-brief",
        name: "Big Work Brief",
        command: "/big-work-brief",
        capability: "ถาม 5 คำถามสำคัญก่อนเริ่มงานใหญ่ ทั้งเขียน วิเคราะห์ วางแผน หรือออกแบบระบบ",
        link: "./.cursor/skills/big-work-brief/SKILL.md",
        seeded: true
      },
      {
        id: "style-clone",
        name: "Style Clone",
        command: "/style-clone",
        capability: "วิเคราะห์ตัวอย่างงานเขียน 3-5 ชิ้น แล้วเขียนงานใหม่ให้เสียงเหมือนเจ้าของสไตล์",
        link: "./.cursor/skills/style-clone/SKILL.md",
        seeded: true
      },
      {
        id: "red-team-plan",
        name: "Red Team Plan",
        command: "/red-team-plan",
        capability: "โจมตีแผนก่อน หา assumption ที่ผิด แล้วค่อย steelman และให้ความเห็นจริง",
        link: "./.cursor/skills/red-team-plan/SKILL.md",
        seeded: true
      },
      {
        id: "design-the-prompt",
        name: "Design The Prompt",
        command: "/design-the-prompt",
        capability: "เขียน prompt ที่ดีที่สุดสำหรับงานนั้น แล้วใช้ prompt นั้นทำงานต่อทันที",
        link: "./.cursor/skills/design-the-prompt/SKILL.md",
        seeded: true
      },
      {
        id: "create-skill",
        name: "Create Skill",
        command: "/create-skill",
        capability: "สร้าง Cursor skill ใหม่จากงานที่ทำซ้ำ พร้อมโครงสร้าง SKILL.md",
        link: "https://cursor.com/docs/skills",
        seeded: true
      }
    ];

    const els = {
      form: document.getElementById("skillForm"),
      id: document.getElementById("skillId"),
      name: document.getElementById("skillName"),
      command: document.getElementById("skillCommand"),
      capability: document.getElementById("skillCapability"),
      link: document.getElementById("skillLink"),
      saveBtn: document.getElementById("saveBtn"),
      cancelEdit: document.getElementById("cancelEdit"),
      list: document.getElementById("list"),
      toast: document.getElementById("toast"),
      exportBtn: document.getElementById("exportBtn"),
      importBtn: document.getElementById("importBtn"),
      importFile: document.getElementById("importFile")
    };

    function slugify(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 64) || "skill";
    }

    function loadSkills() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(saved) || saved.length === 0) return SEED.slice();
        const savedIds = new Set(saved.map((item) => item.id));
        const missingSeed = SEED.filter((item) => !savedIds.has(item.id));
        return saved.concat(missingSeed);
      } catch (error) {
        return SEED.slice();
      }
    }

    function saveSkills(skills) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(skills));
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.style.display = "block";
      setTimeout(() => { els.toast.style.display = "none"; }, 1600);
    }

    function resetForm() {
      els.form.reset();
      els.id.value = "";
      els.saveBtn.textContent = "เพิ่ม skill";
      els.cancelEdit.hidden = true;
    }

    function render() {
      const skills = loadSkills();
      els.list.innerHTML = "";
      if (!skills.length) {
        els.list.innerHTML = '<div class="empty panel">ยังไม่มี skill ในคลัง</div>';
        return;
      }
      skills.forEach((skill) => {
        const card = document.createElement("article");
        card.className = "card";
        card.id = skill.id;
        const link = skill.link
          ? `<div class="link"><a href="${skill.link}" target="_blank" rel="noopener">เปิดลิงก์ใช้งาน</a></div>`
          : `<div class="link">ยังไม่มีลิงก์</div>`;
        card.innerHTML = `
          <h2>${skill.name}</h2>
          <div class="command">${skill.command}</div>
          <p class="cap">${skill.capability}</p>
          ${link}
          <div class="card-actions">
            <button type="button" data-copy="${skill.command}">คัดลอกคำสั่ง</button>
            <button type="button" class="primary" data-use="${skill.id}">วิธีใช้</button>
            <button type="button" class="ghost" data-download="${skill.id}">ดาวน์โหลด SKILL.md</button>
            <button type="button" class="ghost" data-edit="${skill.id}">แก้ไขลิงก์</button>
            <button type="button" class="danger" data-delete="${skill.id}">ลบ</button>
          </div>
        `;
        els.list.appendChild(card);
      });
    }

    function usageText(skill) {
      return [
        `Skill: ${skill.name}`,
        `พิมพ์ใน Cursor Chat: ${skill.command}`,
        `ความสามารถ: ${skill.capability}`,
        skill.link ? `ลิงก์: ${skill.link}` : "ยังไม่มีลิงก์"
      ].join("\n");
    }

    els.name.addEventListener("input", () => {
      if (!els.command.value || els.command.dataset.auto === "1") {
        els.command.value = "/" + slugify(els.name.value);
        els.command.dataset.auto = "1";
      }
    });

    els.command.addEventListener("input", () => {
      els.command.dataset.auto = "0";
    });

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      const skills = loadSkills();
      const name = els.name.value.trim();
      const command = (els.command.value.trim() || "/" + slugify(name)).replace(/\s+/g, "-");
      const capability = els.capability.value.trim();
      const link = els.link.value.trim();
      const currentId = els.id.value;
      const id = currentId || slugify(command.replace(/^\//, "") || name);

      const next = {
        id,
        name,
        command: command.startsWith("/") ? command : "/" + command,
        capability,
        link,
        seeded: false
      };

      const index = skills.findIndex((item) => item.id === id);
      if (index >= 0) skills[index] = { ...skills[index], ...next };
      else skills.unshift(next);

      saveSkills(skills);
      resetForm();
      render();
      toast(currentId ? "อัปเดต skill แล้ว" : "เพิ่ม skill แล้ว");
      location.hash = id;
    });

    els.cancelEdit.addEventListener("click", resetForm);

    els.list.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const skills = loadSkills();

      if (button.dataset.copy) {
        await navigator.clipboard.writeText(button.dataset.copy);
        toast("คัดลอก " + button.dataset.copy);
      }

      if (button.dataset.use) {
        const skill = skills.find((item) => item.id === button.dataset.use);
        await navigator.clipboard.writeText(usageText(skill));
        toast("คัดลอกวิธีใช้แล้ว ไปวางใน Cursor ได้เลย");
      }

      if (button.dataset.download) {
        const skill = skills.find((item) => item.id === button.dataset.download);
        const slug = slugify(skill.command.replace(/^\//, "") || skill.name);
        const body = [
          "---",
          "name: " + slug,
          "description: " + skill.capability.replace(/\n/g, " "),
          "---",
          "",
          "# " + skill.name,
          "",
          skill.capability,
          "",
          "Use this skill when the user invokes " + skill.command + "."
        ].join("\n");
        const blob = new Blob([body], { type: "text/markdown" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "SKILL.md";
        a.click();
        URL.revokeObjectURL(url);
        toast("ดาวน์โหลด SKILL.md แล้ว วางในโฟลเดอร์ ~/.cursor/skills/" + slug + "/");
      }

      if (button.dataset.edit) {
        const skill = skills.find((item) => item.id === button.dataset.edit);
        els.id.value = skill.id;
        els.name.value = skill.name;
        els.command.value = skill.command;
        els.capability.value = skill.capability;
        els.link.value = skill.link || "";
        els.saveBtn.textContent = "อัปเดต skill";
        els.cancelEdit.hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (button.dataset.delete) {
        const next = skills.filter((item) => item.id !== button.dataset.delete);
        saveSkills(next);
        render();
        toast("ลบ skill แล้ว");
      }
    });

    els.exportBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(loadSkills(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "skill-desk.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    els.importBtn.addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", async () => {
      const file = els.importFile.files[0];
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data)) return;
      saveSkills(data);
      render();
      toast("นำเข้า skill แล้ว");
      els.importFile.value = "";
    });

    render();
    if (location.hash) {
      const target = document.querySelector(location.hash);
      if (target) target.scrollIntoView();
    }
  </script>
</body>
</html>
